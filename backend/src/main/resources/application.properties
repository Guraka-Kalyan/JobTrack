# ==============================================================================
# JobTrack - Backend Configuration
# ==============================================================================
# Database Configuration (MySQL)
# Default values connect to local MySQL (e.g. XAMPP or local MySQL Server).
# You can override these using Environment Variables: DB_URL, DB_USERNAME, DB_PASSWORD.
# ==============================================================================

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobtrack_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
# 'update' automatically updates the schema to match Entity classes without dropping data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-in-view is disabled to enforce clear boundaries between service and presentation layer
spring.jpa.open-in-view=false

# Logging configuration
logging.level.com.jobtrack=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
